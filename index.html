<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09090b">
  <meta name="description" content="CineLibre - catálogo privado de películas">
  <title>CineLibre</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #09090b;
      color: #fff;
      min-height: 100vh;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(9,9,11,.97);
      border-bottom: 1px solid #27272a;
      padding: 15px;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 13px;
    }

    .logo {
      color: #e50914;
      font-size: 25px;
      font-weight: bold;
    }

    .privacy {
      color: #86efac;
      font-size: 12px;
    }

    input,
    textarea,
    select {
      width: 100%;
      background: #18181b;
      color: #fff;
      border: 1px solid #3f3f46;
      border-radius: 9px;
      padding: 12px;
      font-size: 15px;
      outline: none;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #e50914;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 20px 16px 100px;
    }

    h1 {
      font-size: 27px;
      margin-bottom: 7px;
    }

    h2 {
      margin-bottom: 15px;
    }

    .subtitle {
      color: #a1a1aa;
      margin-bottom: 24px;
    }

    .section {
      margin-top: 28px;
    }

    .movies {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .movie {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 12px;
      overflow: hidden;
    }

    .poster {
      width: 100%;
      height: 220px;
      object-fit: cover;
      background: linear-gradient(135deg,#18181b,#3f3f46);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 55px;
    }

    .movie-info {
      padding: 12px;
    }

    .title {
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 5px;
    }

    .meta {
      color: #a1a1aa;
      font-size: 13px;
      margin-bottom: 9px;
    }

    .description {
      color: #d4d4d8;
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 10px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 11px 13px;
      font-weight: bold;
      cursor: pointer;
    }

    .watch {
      width: 100%;
      background: #e50914;
      color: white;
    }

    .favorite {
      width: 100%;
      margin-top: 7px;
      background: #27272a;
      color: white;
    }

    .favorite.active {
      background: #7f1d1d;
      color: #fecaca;
    }

    .delete {
      width: 100%;
      margin-top: 7px;
      background: #27272a;
      color: #fca5a5;
    }

    .add-button {
      width: 100%;
      background: #fff;
      color: #111;
      font-size: 16px;
      margin-bottom: 15px;
    }

    .form {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 12px;
      padding: 16px;
    }

    .form label {
      display: block;
      color: #d4d4d8;
      font-size: 13px;
      margin: 12px 0 6px;
    }

    .form label:first-child {
      margin-top: 0;
    }

    .save {
      width: 100%;
      background: #e50914;
      color: white;
      margin-top: 16px;
    }

    .cancel {
      width: 100%;
      background: #27272a;
      color: white;
      margin-top: 8px;
    }

    .file-label {
      display: block;
      background: #27272a;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
    }

    #posterInput {
      display: none;
    }

    .empty {
      color: #a1a1aa;
      padding: 10px 0;
      line-height: 1.5;
    }

    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 30;
      display: flex;
      justify-content: center;
      gap: 20px;
      padding: 10px;
      background: #111113;
      border-top: 1px solid #27272a;
    }

    nav button {
      background: transparent;
      color: #a1a1aa;
      font-size: 13px;
    }

    nav button.active {
      color: white;
    }

    .hidden {
      display: none !important;
    }

    /* Reproductor */
    .player {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0,0,0,.95);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px;
    }

    .player-box {
      width: 100%;
      max-width: 900px;
    }

    .player video {
      width: 100%;
      max-height: 75vh;
      background: #000;
      border-radius: 10px;
    }

    .close-player {
      width: 100%;
      margin-top: 10px;
      background: #27272a;
      color: white;
    }

    .notice {
      background: #172554;
      color: #bfdbfe;
      padding: 12px;
      border-radius: 9px;
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 15px;
    }

    @media (min-width: 650px) {
      .movies {
        grid-template-columns: repeat(4, 1fr);
      }

      .poster {
        height: 270px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="top">
    <div class="logo">🎬 CineLibre</div>
    <div class="privacy">🔒 Privado</div>
  </div>

  <input
    id="search"
    type="search"
    placeholder="🔎 Buscar películas..."
    autocomplete="off"
  >
</header>

<main>

  <section id="home">

    <h1>Bienvenido a CineLibre</h1>

    <p class="subtitle">
      Tu catálogo de películas, sencillo y privado.
    </p>

    <button class="add-button" onclick="openAddForm()">
      ➕ Añadir película
    </button>

    <div class="section">
      <h2>🎬 Películas</h2>
      <div id="movies" class="movies"></div>
    </div>

  </section>

  <section id="favoritesSection" class="hidden">

    <h2>❤️ Mis favoritos</h2>

    <div id="favorites" class="movies"></div>

  </section>

  <section id="addSection" class="hidden">

    <h2>➕ Añadir película</h2>

    <div class="notice">
      La información que añadas se guarda en este dispositivo.
      La película online se reproduce desde la dirección que introduzcas.
    </div>

    <div class="form">

      <label for="titleInput">Título</label>
      <input
        id="titleInput"
        type="text"
        placeholder="Ejemplo: Mi película"
      >

      <label for="yearInput">Año</label>
      <input
        id="yearInput"
        type="number"
        placeholder="2026"
      >

      <label for="genreInput">Género</label>
      <input
        id="genreInput"
        type="text"
        placeholder="Acción, comedia..."
      >

      <label for="descriptionInput">Descripción</label>
      <textarea
        id="descriptionInput"
        placeholder="Descripción de la película..."
      ></textarea>

      <label>Carátula</label>

      <label class="file-label" for="posterInput">
        🖼️ Elegir carátula del teléfono
      </label>

      <input
        id="posterInput"
        type="file"
        accept="image/*"
      >

      <p
        id="posterName"
        style="color:#a1a1aa;font-size:12px;margin-top:8px;"
      ></p>

      <label for="urlInput">
        Enlace directo al vídeo
      </label>

      <input
        id="urlInput"
        type="url"
        placeholder="https://ejemplo.com/pelicula.mp4"
      >

      <button class="save" onclick="saveMovie()">
        💾 Guardar película
      </button>

      <button class="cancel" onclick="showSection('home')">
        Cancelar
      </button>

    </div>

  </section>

</main>

<nav>

  <button id="homeBtn" class="active" onclick="showSection('home')">
    🏠 Inicio
  </button>

  <button onclick="showSection('favoritesSection')">
    ❤️ Favoritos
  </button>

  <button onclick="openAddForm()">
    ➕ Añadir
  </button>

</nav>

<div id="player" class="player hidden">

  <div class="player-box">

    <video id="videoPlayer" controls playsinline></video>

    <button class="close-player" onclick="closePlayer()">
      ✕ Cerrar reproductor
    </button>

  </div>

</div>

<script>

  /* Películas incluidas inicialmente */
  const defaultMovies = [
    {
      id: "demo1",
      title: "Película de ejemplo",
      year: "2026",
      genre: "Demo",
      description: "Película de ejemplo para probar CineLibre.",
      poster: "",
      url: "",
      custom: false
    },
    {
      id: "demo2",
      title: "Aventura",
      year: "2026",
      genre: "Aventura",
      description: "Título de ejemplo.",
      poster: "",
      url: "",
      custom: false
    },
    {
      id: "demo3",
      title: "Ciencia ficción",
      year: "2026",
      genre: "Ciencia ficción",
      description: "Título de ejemplo.",
      poster: "",
      url: "",
      custom: false
    },
    {
      id: "demo4",
      title: "Documental",
      year: "2026",
      genre: "Documental",
      description: "Título de ejemplo.",
      poster: "",
      url: "",
      custom: false
    }
  ];

  let customMovies =
    JSON.parse(localStorage.getItem("cinelibre_movies")) || [];

  let favorites =
    JSON.parse(localStorage.getItem("cinelibre_favorites")) || [];

  let selectedPoster = "";

  const moviesContainer =
    document.getElementById("movies");

  const favoritesContainer =
    document.getElementById("favorites");

  const search =
    document.getElementById("search");

  const posterInput =
    document.getElementById("posterInput");

  function allMovies() {
    return [...defaultMovies, ...customMovies];
  }

  function escapeHTML(value) {
    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function renderMovies(list, container) {

    container.innerHTML = "";

    if (!list.length) {
      container.innerHTML =
        '<div class="empty">No hay películas para mostrar.</div>';
      return;
    }

    list.forEach(movie => {

      const favorite =
        favorites.includes(movie.id);

      const card =
        document.createElement("article");

      card.className = "movie";

      const posterHTML = movie.poster
        ? `<img class="poster"
             src="${escapeHTML(movie.poster)}"
             alt="Carátula de ${escapeHTML(movie.title)}">`
        : `<div class="poster">🎬</div>`;

      card.innerHTML = `
        ${posterHTML}

        <div class="movie-info">

          <div class="title">
            ${escapeHTML(movie.title)}
          </div>

          <div class="meta">
            ${escapeHTML(movie.year || "Sin año")}
            ·
            ${escapeHTML(movie.genre || "Sin género")}
          </div>

          ${
            movie.description
            ? `<div class="description">
                ${escapeHTML(movie.description)}
              </div>`
            : ""
          }

          <button class="watch"
            data-id="${escapeHTML(movie.id)}">
            ▶ Ver
          </button>

          <button class="favorite ${favorite ? "active" : ""}"
            data-favorite="${escapeHTML(movie.id)}">
            ${favorite ? "♥ En favoritos" : "♡ Añadir a favoritos"}
          </button>

          ${
            movie.custom
            ? `<button class="delete"
                 data-delete="${escapeHTML(movie.id)}">
                 🗑️ Eliminar
               </button>`
            : ""
          }

        </div>
      `;

      card
        .querySelector("[data-id]")
        .addEventListener("click", () => {
          playMovie(movie.id);
        });

      card
        .querySelector("[data-favorite]")
        .addEventListener("click", () => {
          toggleFavorite(movie.id);
        });

      const deleteButton =
        card.querySelector("[data-delete]");

      if (deleteButton) {
        deleteButton.addEventListener("click", () => {
          deleteMovie(movie.id);
        });
      }

      container.appendChild(card);
    });
  }

  function render() {

    const text =
      search.value.toLowerCase().trim();

    const filtered =
      allMovies().filter(movie =>
        movie.title.toLowerCase().includes(text) ||
        movie.genre.toLowerCase().includes(text)
      );

    renderMovies(
      filtered,
      moviesContainer
    );

    const favoriteMovies =
      allMovies().filter(movie =>
        favorites.includes(movie.id)
      );

    renderMovies(
      favoriteMovies,
      favoritesContainer
    );
  }

  function toggleFavorite(id) {

    if (favorites.includes(id)) {

      favorites =
        favorites.filter(item => item !== id);

    } else {

      favorites.push(id);
    }

    localStorage.setItem(
      "cinelibre_favorites",
      JSON.stringify(favorites)
    );

    render();
  }

  function playMovie(id) {

    const movie =
      allMovies().find(item => item.id === id);

    if (!movie) return;

    if (!movie.url) {

      alert(
        "Esta película todavía no tiene un enlace de vídeo."
      );

      return;
    }

    const player =
      document.getElementById("player");

    const video =
      document.getElementById("videoPlayer");

    video.src = movie.url;

    player.classList.remove("hidden");

    video.play().catch(() => {});
  }

  function closePlayer() {

    const video =
      document.getElementById("videoPlayer");

    video.pause();
    video.removeAttribute("src");
    video.load();

    document
      .getElementById("player")
      .classList.add("hidden");
  }

  function deleteMovie(id) {

    const movie =
      customMovies.find(item => item.id === id);

    if (!movie) return;

    if (!confirm(
      "¿Eliminar " + movie.title + " de CineLibre?"
    )) {
      return;
    }

    customMovies =
      customMovies.filter(item => item.id !== id);

    favorites =
      favorites.filter(item => item !== id);

    localStorage.setItem(
      "cinelibre_movies",
      JSON.stringify(customMovies)
    );

    localStorage.setItem(
      "cinelibre_favorites",
      JSON.stringify(favorites)
    );

    render();
  }

  function openAddForm() {

    document
      .getElementById("home")
      .classList.add("hidden");

    document
      .getElementById("favoritesSection")
      .classList.add("hidden");

    document
      .getElementById("addSection")
      .classList.remove("hidden");

    document
      .querySelectorAll("nav button")
      .forEach(button =>
        button.classList.remove("active")
      );

    selectedPoster = "";

    document
      .getElementById("posterName")
      .textContent = "";
  }

  function showSection(sectionId) {

    document
      .querySelectorAll("main section")
      .forEach(section =>
        section.classList.add("hidden")
      );

    document
      .getElementById(sectionId)
      .classList.remove("hidden");

    document
      .querySelectorAll("nav button")
      .forEach(button =>
        button.classList.remove("active")
      );

    if (sectionId === "home") {
      document
        .getElementById("homeBtn")
        .classList.add("active");
    }

    if (sectionId === "favoritesSection") {
      render();
    }
  }

  posterInput.addEventListener(
    "change",
    function() {

      const file = this.files[0];

      if (!file) return;

      if (!file.type.startsWith("image/")) {

        alert("Selecciona una imagen.");

        this.value = "";

        return;
      }

      const reader =
        new FileReader();

      reader.onload = function(event) {

        selectedPoster =
          event.target.result;

        document
          .getElementById("posterName")
          .textContent =
          "✅ Carátula seleccionada: " +
          file.name;
      };

      reader.readAsDataURL(file);
    }
  );

  function saveMovie() {

    const title =
      document
        .getElementById("titleInput")
        .value.trim();

    const year =
      document
        .getElementById("yearInput")
        .value.trim();

    const genre =
      document
        .getElementById("genreInput")
        .value.trim();

    const description =
      document
        .getElementById("descriptionInput")
        .value.trim();

    const url =
      document
        .getElementById("urlInput")
        .value.trim();

    if (!title) {
      alert("Escribe el título.");
      return;
    }

    if (!url) {
      alert("Escribe el enlace del vídeo.");
      return;
    }

    try {

      new URL(url);

    } catch {

      alert("El enlace del vídeo no parece válido.");
      return;
    }

    const movie = {

      id:
        "movie_" +
        Date.now(),

      title,
      year,
      genre,
      description,

      poster:
        selectedPoster || "",

      url,

      custom: true
    };

    customMovies.push(movie);

    try {

      localStorage.setItem(
        "cinelibre_movies",
        JSON.stringify(customMovies)
      );

    } catch {

      alert(
        "La carátula es demasiado grande para el almacenamiento del navegador. " +
        "Prueba con una imagen más pequeña."
      );

      customMovies =
        customMovies.filter(
          item => item.id !== movie.id
        );

      return;
    }

    document
      .getElementById("titleInput")
      .value = "";

    document
      .getElementById("yearInput")
      .value = "";

    document
      .getElementById("genreInput")
      .value = "";

    document
      .getElementById("descriptionInput")
      .value = "";

    document
      .getElementById("urlInput")
      .value = "";

    posterInput.value = "";

    selectedPoster = "";

    document
      .getElementById("posterName")
      .textContent = "";

    render();

    alert("✅ Película añadida a CineLibre.");

    showSection("home");
  }

  search.addEventListener(
    "input",
    render
  );

  render();

</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./sw.js");
  });
}
</script>
</body>
</html>
