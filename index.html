<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Player</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #581c87);
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .player {
      width: 95%;
      max-width: 420px;
      background: rgba(20, 20, 30, 0.95);
      border-radius: 25px;
      padding: 25px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #c084fc;
    }

    .cover {
      width: 220px;
      height: 220px;
      margin: auto;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,.5);
    }

    .cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .song-info {
      text-align: center;
      margin: 20px 0;
    }

    .song-info h2 {
      font-size: 22px;
    }

    .song-info p {
      color: #aaa;
      margin-top: 6px;
    }

    .progress-container {
      margin: 20px 0;
    }

    #progress {
      width: 100%;
      accent-color: #a855f7;
      cursor: pointer;
    }

    .time {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #aaa;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin: 20px 0;
    }

    button {
      border: none;
      background: transparent;
      color: white;
      font-size: 25px;
      cursor: pointer;
      transition: .2s;
    }

    button:hover {
      color: #c084fc;
      transform: scale(1.1);
    }

    #play {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: #9333ea;
      font-size: 28px;
    }

    .playlist {
      margin-top: 25px;
    }

    .playlist h3 {
      margin-bottom: 10px;
    }

    .song {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-radius: 12px;
      cursor: pointer;
      transition: .2s;
    }

    .song:hover,
    .song.active {
      background: rgba(168, 85, 247, .25);
    }

    .song img {
      width: 45px;
      height: 45px;
      object-fit: cover;
      border-radius: 8px;
    }

    .song-info-list {
      flex: 1;
    }

    .song-info-list strong {
      display: block;
    }

    .song-info-list span {
      color: #999;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="player">

    <h1>🎵 My Music</h1>

    <div class="cover">
      <img id="cover" src="img/cancion1.jpg" alt="Portada">
    </div>

    <div class="song-info">
      <h2 id="title">Mi Canción</h2>
      <p id="artist">Artista</p>
    </div>

    <audio id="audio"></audio>

    <div class="progress-container">
      <input type="range" id="progress" value="0" min="0" max="100">

      <div class="time">
        <span id="currentTime">0:00</span>
        <span id="duration">0:00</span>
      </div>
    </div>

    <div class="controls">
      <button id="prev">⏮</button>
      <button id="play">▶</button>
      <button id="next">⏭</button>
    </div>

    <div class="playlist">
      <h3>Lista de canciones</h3>

      <div class="song active" data-index="0">
        <img src="img/cancion1.jpg" alt="">
        <div class="song-info-list">
          <strong>Mi Canción</strong>
          <span>Artista 1</span>
        </div>
      </div>

      <div class="song" data-index="1">
        <img src="img/cancion2.jpg" alt="">
        <div class="song-info-list">
          <strong>Otra Canción</strong>
          <span>Artista 2</span>
        </div>
      </div>

      <div class="song" data-index="2">
        <img src="img/cancion3.jpg" alt="">
        <div class="song-info-list">
          <strong>Última Canción</strong>
          <span>Artista 3</span>
        </div>
      </div>

    </div>
  </div>

  <script>
    const audio = document.getElementById("audio");
    const playButton = document.getElementById("play");
    const progress = document.getElementById("progress");
    const currentTime = document.getElementById("currentTime");
    const duration = document.getElementById("duration");

    const title = document.getElementById("title");
    const artist = document.getElementById("artist");
    const cover = document.getElementById("cover");

    const songs = [
      {
        title: "Mi Canción",
        artist: "Artista 1",
        audio: "music/cancion1.mp3",
        cover: "img/cancion1.jpg"
      },
      {
        title: "Otra Canción",
        artist: "Artista 2",
        audio: "music/cancion2.mp3",
        cover: "img/cancion2.jpg"
      },
      {
        title: "Última Canción",
        artist: "Artista 3",
        audio: "music/cancion3.mp3",
        cover: "img/cancion3.jpg"
      }
    ];

    let songIndex = 0;

    function loadSong(index) {
      const song = songs[index];

      title.textContent = song.title;
      artist.textContent = song.artist;
      cover.src = song.cover;
      audio.src = song.audio;

      document.querySelectorAll(".song").forEach((item, i) => {
        item.classList.toggle("active", i === index);
      });
    }

    function playSong() {
      audio.play();
      playButton.textContent = "⏸";
    }

    function pauseSong() {
      audio.pause();
      playButton.textContent = "▶";
    }

    playButton.addEventListener("click", () => {
      if (audio.paused) {
        playSong();
      } else {
        pauseSong();
      }
    });

    document.getElementById("next").addEventListener("click", () => {
      songIndex++;

      if (songIndex >= songs.length) {
        songIndex = 0;
      }

      loadSong(songIndex);
      playSong();
    });

    document.getElementById("prev").addEventListener("click", () => {
      songIndex--;

      if (songIndex < 0) {
        songIndex = songs.length - 1;
      }

      loadSong(songIndex);
      playSong();
    });

    audio.addEventListener("loadedmetadata", () => {
      progress.max = audio.duration;
      duration.textContent = formatTime(audio.duration);
    });

    audio.addEventListener("timeupdate", () => {
      progress.value = audio.currentTime;
      currentTime.textContent = formatTime(audio.currentTime);
    });

    progress.addEventListener("input", () => {
      audio.currentTime = progress.value;
    });

    audio.addEventListener("ended", () => {
      document.getElementById("next").click();
    });

    document.querySelectorAll(".song").forEach(song => {
      song.addEventListener("click", () => {
        songIndex = Number(song.dataset.index);
        loadSong(songIndex);
        playSong();
      });
    });

    function formatTime(seconds) {
      if (isNaN(seconds)) return "0:00";

      const minutes = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);

      return `${minutes}:${secs < 10 ? "0" : ""}${secs}`;
    }

    loadSong(songIndex);
  </script>

</body>
</html>
